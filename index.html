<script>
const tools=[
["Photo Resizer","🖼️","Image","resize"],
["Image Compressor","📦","Image","compress"],
["JPG to PNG","🔄","Image","jpgpng"],
["PNG to JPG","🔄","Image","pngjpg"],
["PDF Merger","📑","PDF","merge"],
["Image to PDF","📄","PDF","imgpdf"],
["Age Calculator","🎂","Calculator","age"],
["Percentage Calculator","％","Calculator","percent"],
["GST Calculator","₹","Calculator","gst"],
["EMI Calculator","🏦","Calculator","emi"],
["Word Counter","📝","Other","words"],
["QR Code Generator","▦","Other","qr"],
["Password Generator","🔐","Other","password"],
["Unit Converter","📏","Other","unit"],
["Stopwatch","⏱️","Other","stopwatch"],
["Timer","⏰","Other","timer"]
];
const grid=document.getElementById("toolGrid");
function render(list=tools){
grid.innerHTML=list.map(t=>`<div class="card" onclick="openTool('${t[3]}')"><div class="emoji">${t[1]}</div><h3>${t[0]}</h3></div>`).join("");
}
render();
function filterTools(){
let q=document.getElementById("search").value.toLowerCase();
render(tools.filter(t=>t[0].toLowerCase().includes(q)));
}
function filterCategory(c){render(tools.filter(t=>t[2]===c));document.getElementById("home").scrollIntoView()}
function showHome(){
document.getElementById("panel").classList.remove("active");
document.getElementById("home").style.display="block";
document.getElementById("search").value="";
render();
}
function openTool(id){
document.getElementById("home").style.display="none";
let p=document.getElementById("panel");p.classList.add("active");
let t=tools.find(x=>x[3]===id);
document.getElementById("toolTitle").textContent=t[1]+" "+t[0];
document.getElementById("toolContent").innerHTML=views[id];
p.scrollIntoView({behavior:"smooth"});
}
const views={
resize:`<p>Select an image and enter new dimensions.</p><input type="file" id="file" accept="image/*"><input id="w" type="number" placeholder="Width in pixels"><input id="h" type="number" placeholder="Height in pixels"><button class="action" onclick="processImage('resize')">Resize Image</button><div id="out"></div>`,
compress:`<p>Reduce image file size by adjusting quality.</p><input type="file" id="file" accept="image/*"><label>Quality (0.1 to 1)</label><input id="quality" type="number" min=".1" max="1" step=".1" value=".7"><button class="action" onclick="processImage('compress')">Compress Image</button><div id="out"></div>`,
jpgpng:`<p>Convert JPG/JPEG image to PNG.</p><input type="file" id="file" accept="image/jpeg"><button class="action" onclick="processImage('jpgpng')">Convert to PNG</button><div id="out"></div>`,
pngjpg:`<p>Convert PNG image to JPG.</p><input type="file" id="file" accept="image/png"><button class="action" onclick="processImage('pngjpg')">Convert to JPG</button><div id="out"></div>`,
merge:`<p>Select two or more PDF files.</p><input type="file" id="pdfs" accept="application/pdf" multiple><button class="action" onclick="mergePDF()">Merge PDFs</button><div id="out"></div>`,
imgpdf:`<p>Select images to create one PDF.</p><input type="file" id="images" accept="image/*" multiple><button class="action" onclick="imagesPDF()">Create PDF</button><div id="out"></div>`,
age:`<p>Enter your date of birth.</p><input type="date" id="dob"><button class="action" onclick="calcAge()">Calculate Age</button><div id="out" class="result"></div>`,
percent:`<p>Find percentage of a number.</p><input id="p1" type="number" placeholder="Percentage (%)"><input id="p2" type="number" placeholder="Number"><button class="action" onclick="result('Percentage = '+(num('p1')*num('p2')/100))">Calculate</button><div id="out" class="result"></div>`,
gst:`<p>Calculate GST amount.</p><input id="amount" type="number" placeholder="Amount (₹)"><input id="rate" type="number" placeholder="GST rate (%) e.g. 18"><select id="gstmode"><option value="add">Add GST</option><option value="remove">Remove GST</option></select><button class="action" onclick="gstCalc()">Calculate GST</button><div id="out" class="result"></div>`,
emi:`<p>Calculate your monthly loan EMI.</p><input id="principal" type="number" placeholder="Loan amount (₹)"><input id="interest" type="number" placeholder="Annual interest rate (%)"><input id="months" type="number" placeholder="Duration in months"><button class="action" onclick="emiCalc()">Calculate EMI</button><div id="out" class="result"></div>`,
words:`<p>Type or paste your text below.</p><textarea id="text" rows="8" placeholder="Enter your text..." oninput="countWords()"></textarea><div id="out" class="result">Words: 0 | Characters: 0</div>`,
qr:`<p>Enter text or a website URL.</p><input id="qrtext" placeholder="Enter text or URL"><button class="action" onclick="makeQR()">Generate QR Code</button><div id="qrcode"></div>`,
password:`<p>Choose password length.</p><input id="plen" type="number" value="16" min="4" max="64"><label><input type="checkbox" id="symbols" checked> Include symbols</label><button class="action" onclick="makePassword()">Generate Password</button><div id="out" class="result"></div>`,
unit:`<p>Convert common units.</p><input id="unitval" type="number" placeholder="Enter value"><select id="unitfrom"><option value="km">Kilometers</option><option value="m">Meters</option><option value="cm">Centimeters</option><option value="kg">Kilograms</option><option value="g">Grams</option><option value="mile">Miles</option><option value="ft">Feet</option></select><select id="unitto"><option value="m">Meters</option><option value="km">Kilometers</option><option value="cm">Centimeters</option><option value="g">Grams</option><option value="kg">Kilograms</option><option value="mile">Miles</option><option value="ft">Feet</option></select><button class="action" onclick="convertUnit()">Convert</button><div id="out" class="result"></div>`,
stopwatch:`<h3 id="clock">00:00:00</h3><button class="action" onclick="startWatch()">Start</button><button class="action" onclick="stopWatch()">Stop</button><button class="action" onclick="resetWatch()">Reset</button>`,
timer:`<p>Set timer duration.</p><input id="seconds" type="number" placeholder="Seconds" value="60"><h3 id="timerDisplay">01:00</h3><button class="action" onclick="startTimer()">Start Timer</button><button class="action" onclick="stopTimer()">Stop</button><button class="action" onclick="resetTimer()">Reset</button>`
};
function num(id){return Number(document.getElementById(id).value)||0}
function result(s){document.getElementById("out").textContent=s}
function processImage(mode){
let f=document.getElementById("file").files[0];if(!f)return alert("Please select an image.");
let url=URL.createObjectURL(f),img=new Image();
img.onload=()=>{
let c=document.createElement("canvas");
let w=mode==="resize"?(num("w")||img.width):img.width;
let h=mode==="resize"?(num("h")||img.height):img.height;
c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
let type=mode==="jpgpng"?"image/png":mode==="pngjpg"?"image/jpeg":f.type;
let quality=mode==="compress"?Math.min(1,Math.max(.1,num("quality"))):.92;
c.toBlob(blob=>{
let a=document.createElement("a"),u=URL.createObjectURL(blob);
a.href=u;a.download="kaameasy-image."+(type==="image/png"?"png":"jpg");a.textContent="Download Image";
let out=document.getElementById("out");out.innerHTML="";out.append(a);
let preview=document.createElement("img");preview.src=u;preview.className="preview";out.append(preview);
},type,quality);
};img.src=url;
}
async function mergePDF(){
let files=document.getElementById("pdfs").files;if(files.length<2)return alert("Select at least two PDFs.");
try{let merged=await PDFLib.PDFDocument.create();for(let f of files){let pdf=await PDFLib.PDFDocument.load(await f.arrayBuffer());let pages=await merged.copyPages(pdf,pdf.getPageIndices());pages.forEach(p=>merged.addPage(p));}
let bytes=await merged.save();downloadBlob(new Blob([bytes],{type:"application/pdf"}),"merged.pdf");result("PDF merged. Download started.");
}catch(e){result("Could not merge PDFs. Check your files.");}
}
async function imagesPDF(){
let files=document.getElementById("images").files;if(!files.length)return alert("Select images.");
let {jsPDF}=window.jspdf;let pdf=new jsPDF();
for(let i=0;i<files.length;i++){let data=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(files[i]);});let img=new Image();await new Promise(resolve=>{img.onload=resolve;img.src=data});if(i)pdf.addPage();let pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),scale=Math.min(pw/img.width,ph/img.height);pdf.addImage(data,"JPEG",(pw-img.width*scale)/2,(ph-img.height*scale)/2,img.width*scale,img.height*scale);}
pdf.save("kaameasy-images.pdf");result("Your PDF has been created.");
}
function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function calcAge(){let d=new Date(document.getElementById("dob").value);if(!document.getElementById("dob").value||d>new Date())return result("Enter a valid date of birth.");let n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}result(`Your age is ${y} years, ${m} months and ${day} days.`)}
function gstCalc(){let a=num("amount"),r=num("rate"),v=num("gstmode")==0?0:0;let mode=document.getElementById("gstmode").value;let gst=mode==="add"?a*r/100:a-a/(1+r/100);result(`GST Amount: ₹${gst.toFixed(2)}\n${mode==="add"?"Total with GST":"Amount before GST"}: ₹${(mode==="add"?a+gst:a-gst).toFixed(2)}`)}
function emiCalc(){let p=num("principal"),r=num("interest")/1200,n=num("months");if(!p||!n)return result("Enter valid loan details.");let e=r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);result(`Monthly EMI: ₹${e.toFixed(2)}\nTotal payment: ₹${(e*n).toFixed(2)}\nTotal interest: ₹${(e*n-p).toFixed(2)}`)}
function countWords(){let s=document.getElementById("text").value;result(`Words: ${(s.trim().match(/\S+/g)||[]).length}\nCharacters: ${s.length}\nCharacters (without spaces): ${s.replace(/\s/g,"").length}`)}
function makeQR(){let s=document.getElementById("qrtext").value;if(!s)return alert("Enter text first.");let q=document.getElementById("qrcode");q.innerHTML="";new QRCode(q,{text:s,width:200,height:200});}
function makePassword(){let len=Math.min(64,Math.max(4,num("plen"))),chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"+(document.getElementById("symbols").checked?"!@#$%&*_-?":"");let s="";let a=new Uint32Array(len);crypto.getRandomValues(a);for(let x of a)s+=chars[x%chars.length];result(s); }
const factors={km:1000,m:1,cm:.01,kg:1,g:.001,mile:1609.344,ft:.3048};
function convertUnit(){let a=num("unitval"),f=document.getElementById("unitfrom").value,t=document.getElementById("unitto").value;let mass=["kg","g"];if(mass.includes(f)!==mass.includes(t))return result("Choose units of the same type.");result(`${a} ${f} = ${(a*factors[f]/factors[t]).toFixed(6)} ${t}`)}
let watchInterval=null,watchStart=0,watchElapsed=0,timerInterval=null,timerLeft=60;
function fmt(s){return String(s).padStart(2,"0")}
function showWatch(){let t=Math.floor((watchElapsed+Date.now()-watchStart)/1000);document.getElementById("clock").textContent=fmt(Math.floor(t/3600))+":"+fmt(Math.floor(t%3600/60))+":"+fmt(t%60)}
function startWatch(){if(watchInterval)return;watchStart=Date.now();watchInterval=setInterval(showWatch,250)}
function stopWatch(){if(watchInterval){watchElapsed+=Date.now()-watchStart;clearInterval(watchInterval);watchInterval=null}}
function resetWatch(){stopWatch();watchElapsed=0;document.getElementById("clock").textContent="00:00:00"}
function showTimer(){document.getElementById("timerDisplay").textContent=fmt(Math.floor(timerLeft/60))+":"+fmt(timerLeft%60)}
function startTimer(){if(timerInterval)return;if(timerLeft<=0)timerLeft=num("seconds");if(timerLeft<=0)return;timerInterval=setInterval(()=>{timerLeft--;showTimer();if(timerLeft<=0){stopTimer();alert("Timer finished!");}},1000)}
function stopTimer(){clearInterval(timerInterval);timerInterval=null}
function resetTimer(){stopTimer();timerLeft=num("seconds");showTimer()}
</script>

 }
};
